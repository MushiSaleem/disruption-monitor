name: Monitor aviation disruptions

on:
  schedule:
    - cron: "*/10 * * * *"      # every 10 minutes
  workflow_dispatch:             # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check sources, verify, update incidents
        uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/scripts/monitor.js`);
            await run({ root: process.env.GITHUB_WORKSPACE, core });

      - name: Save changes (only if something changed)
        run: |
          git config user.name "disruption-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add incidents.json resolved.json state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update incidents"
            git push
          fi

